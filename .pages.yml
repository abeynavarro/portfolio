media: src/assets
content:
  - name: projects
    label: projects
    type: collection
    path: src/pages/projects
    fields:
      - name: title
        type: string
      - name: client
        type: string
      - name: rol
        type: string
      - name: year
        type: string
      - name: intro
        type: text
      - name: body
        type: rich-text

    filename: {title}.md